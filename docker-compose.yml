version: '3.8'

services:
  # ClickHouse Dual-Database Storage Engine
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clinical_clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init_clickhouse.sql
    environment:
      CLICKHOUSE_DB: clinical_gateway
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Privacy-Preserving FastAPI Gateway API
  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_api_gateway
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - SECRET_KEY=clinical_privacy_secret_key_2026_miva_mit
      - AES_SECRET_KEY=gK3sP9vL1mN5qR8tW2xY4zA7bC0dE6fH
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
